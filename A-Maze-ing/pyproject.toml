[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generation, solving, and export core for A-Maze-ing."
readme = "README.md"
license = "LICENSE.md"

authors = [
    "artavagy",
    "grgrigor",
]

packages = [
    { include = "mazegen" }
]


[tool.poetry.dependencies]
python = "^3.10"
pydantic = ">=2.0,<3.0"


[tool.poetry.group.dev.dependencies]
flake8 = ">=7.0"
mypy = ">=1.8"
pytest = ">=8.0"
